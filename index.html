<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odia OCR Detector</title>
    
    <script src='https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>

    <script src="https://unpkg.com/docx@8/build/docx.min.js"></script>

    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        #output { border: 1px solid #ccc; padding: 10px; margin-top: 20px; min-height: 100px; background: #f9f9f9; white-space: pre-wrap; }
        #status { font-style: italic; color: #555; }

        /* --- NEW STYLES for download buttons --- */
        #downloadContainer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .hidden {
            display: none;
        }
        .download-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-right: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .download-btn:hover {
            background-color: #218838;
        }
        /* --- End of NEW STYLES --- */
    </style>
</head>
<body>

    <h1>Odia Language OCR</h1>
    <p>Select an image file (PNG, JPG, PDF) containing Odia text to extract it.</p>

    <input type="file" id="imageInput" accept="image/*,application/pdf" />
    <button id="runButton">Recognize Text</button>

    <hr>
    
    <h3>Status:</h3>
    <div id="status">Ready.</div>
    
    <h3>Extracted Text:</h3>
    <div id="output">...</div>

    <div id="downloadContainer" class="hidden">
        <h3>Download Results:</h3>
        <button id="downloadTxt" class="download-btn">Download as .txt</button>
        <button id="downloadDocx" class="download-btn">Download as .docx</button>
    </div>

    <script>
        // Get references to all elements
        const imageInput = document.getElementById('imageInput');
        const runButton = document.getElementById('runButton');
        const statusEl = document.getElementById('status');
        const outputEl = document.getElementById('output');
        
        // NEW: Download element references
        const downloadContainer = document.getElementById('downloadContainer');
        const downloadTxt = document.getElementById('downloadTxt');
        const downloadDocx = document.getElementById('downloadDocx');

        // Tell PDF.js where to find its 'worker' file
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js';

        // 5. NEW: Helper function to trigger file download
        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 6. NEW: TXT Download Logic
        downloadTxt.addEventListener('click', () => {
            const text = outputEl.innerText;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            downloadFile(blob, 'extracted_text.txt');
        });

        // 7. NEW: DOCX Download Logic
        downloadDocx.addEventListener('click', () => {
            const { Document, Packer, Paragraph } = window.docx; // Get tools from docx.js
            const text = outputEl.innerText;
            
            // Convert text with line breaks into separate paragraphs
            const paragraphs = text.split('\n').map(line => 
                new Paragraph({
                    text: line,
                })
            );

            // Create a new document
            const doc = new Document({
                sections: [{
                    children: paragraphs
                }]
            });

            // Pack the document into a blob and download it
            Packer.toBlob(doc).then(blob => {
                downloadFile(blob, 'extracted_text.docx');
            });
        });


        // This is your main OCR function, modified to show the download buttons
        async function correctPerformOCR() {
            const file = imageInput.files[0];
            if (!file) { alert("Please select an image file first."); return; }
            
            outputEl.innerText = "..."; 
            statusEl.innerText = 'Initializing...';
            downloadContainer.classList.add('hidden'); // Hide buttons on new run
            
            let worker = null; 
            
            try {
                // This is your approved code:
                worker = await Tesseract.createWorker('ori+eng');

                if (file.type === "application/pdf") {
                    // --- PDF LOGIC ---
                    statusEl.innerText = 'Loading PDF file...';
                    const fileReader = new FileReader();
                    
                    fileReader.onload = async function() {
                        let fullText = '';
                        try {
                            const pdfData = new Uint8Array(this.result);
                            const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;

                            for (let i = 1; i <= pdf.numPages; i++) {
                                statusEl.innerText = `Recognizing page ${i} of ${pdf.numPages}...`;
                                const page = await pdf.getPage(i);
                                const viewport = page.getViewport({ scale: 1.5 });
                                const canvas = document.createElement('canvas');
                                const context = canvas.getContext('2d');
                                canvas.width = viewport.width;
                                canvas.height = viewport.height;
                                await page.render({ canvasContext: context, viewport: viewport }).promise;
                                
                                const { data: { text } } = await worker.recognize(canvas.toDataURL());
                                fullText += text + '\n\n--- Page Break ---\n\n';
                            }
                            
                            statusEl.innerText = 'Done.';
                            outputEl.innerText = fullText;
                            downloadContainer.classList.remove('hidden'); // Show download buttons

                        } catch (err) {
                             console.error('Error during PDF processing:', err);
                             statusEl.innerText = 'Error: ' + err.message;
                        } finally {
                            console.log('Terminating worker (PDF)...');
                            await worker.terminate();
                        }
                    };
                    
                    fileReader.readAsArrayBuffer(file);
                    
                } else {
                    // --- IMAGE LOGIC (YOUR ORIGINAL CODE) ---
                    statusEl.innerText = 'Recognizing text...';
                    const { data: { text } } = await worker.recognize(file);
                    
                    statusEl.innerText = 'Done.';
                    outputEl.innerText = text;
                    downloadContainer.classList.remove('hidden'); // Show download buttons
                    
                    console.log('Terminating worker (Image)...');
                    await worker.terminate();
                }

            } catch (err) {
                console.error('Error:', err);
                statusEl.innerText = 'Error: ' + err.message;
                if (worker) {
                    await worker.terminate();
                }
            }
        }

        runButton.addEventListener('click', correctPerformOCR);

    </script>

</body>
</html>
